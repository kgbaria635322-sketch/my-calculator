<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Calculator</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="container">
    <section class="calculator-card">
      <h1>Smart Calculator</h1>
      <p class="subtitle">Full-stack calculator with saved history</p>

      <div class="display">
        <div id="expression">0</div>
        <div id="result">0</div>
      </div>

      <div class="inputs">
        <input id="a" type="number" step="any" placeholder="First number">
        <select id="operator">
          <option value="+">+</option>
          <option value="-">−</option>
          <option value="*">×</option>
          <option value="/">÷</option>
        </select>
        <input id="b" type="number" step="any" placeholder="Second number">
      </div>

      <button class="calculate" onclick="calculate()">Calculate</button>
      <button class="clear" onclick="clearInputs()">Clear</button>

      <div class="history-header">
        <h2>Calculation History</h2>
        <button onclick="clearHistory()">Clear History</button>
      </div>
      <ul id="history"></ul>
    </section>
  </main>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
